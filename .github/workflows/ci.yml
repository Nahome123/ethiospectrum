name: Continuous integration
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Protected pages initialize the request-scoped client while Next.js
          # validates routes. CI needs public-shaped values, never production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-publishable-key
